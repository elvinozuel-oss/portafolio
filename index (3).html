<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Portafolio de tatuajes</title>
<meta name="description" content="Portafolio profesional de tatuajes.">
<meta name="theme-color" content="#0c0d0d">
<meta property="og:title" content="Portafolio de tatuajes">
<meta property="og:description" content="Portafolio profesional de tatuajes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=DM+Sans:wght@400;500&family=DM+Mono:wght@400&display=swap">
<style>
/* Layout: portafolio profesional. Cabecera editorial con disponibilidad y contacto, galería en columnas, sobre mí y contacto al final. */
:root{
  --bg:#0c0d0d;
  --surface:#151717;
  --line:#272b2a;
  --fg:#ece8df;
  --muted:#8f918b;
  --accent:#cdb98f;
  --danger:#e39a8a;
  --display:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--body);margin:0;-webkit-font-smoothing:antialiased}
img{max-width:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.wrap{max-width:1240px;margin:0 auto;padding-block:calc(40px + env(safe-area-inset-top,0px)) calc(120px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hd{padding-bottom:28px;border-bottom:1px solid var(--line);margin-bottom:20px}
.eyebrow{font:400 11px/1.3 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0 0 18px}
h1{font:italic 600 clamp(2.6rem,11vw,5.2rem)/.95 var(--display);letter-spacing:-.01em;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.sub{margin:14px 0 0;color:var(--muted);max-width:52ch}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 0}
.badge{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:7px 13px;font:400 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--fg)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin:22px 0 0;font:400 12px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.meta a{text-decoration:none;text-transform:none;letter-spacing:.02em}
.link{background:none;border:0;padding:0;color:var(--accent);font:inherit;letter-spacing:inherit;text-transform:inherit;text-decoration:underline;text-underline-offset:3px}
.cta{margin-top:22px}
.nudge{margin:18px 0 0;padding:12px 14px;border:1px dashed var(--line);color:var(--muted);font-size:14px;max-width:60ch}
.status{padding:56px 0;color:var(--muted);font:400 12px/1.6 var(--mono);letter-spacing:.12em;text-transform:uppercase}
.banner{margin:0 0 18px;padding:12px 14px;border:1px solid var(--danger);color:var(--danger);font-size:14px}
.banner .link{color:var(--danger)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 18px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:none;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font:400 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}

.grid{columns:2;column-gap:10px}
@media(min-width:720px){.grid{columns:3;column-gap:14px}}
@media(min-width:1100px){.grid{columns:4}}
.tile{position:relative;display:block;width:100%;break-inside:avoid;margin:0 0 14px;padding:0;background:none;border:0;text-align:left}
.tile img{display:block;width:100%;height:auto;background:var(--surface);border-radius:2px;transition:opacity .2s}
.tile:hover img{opacity:.88}
.cap{display:flex;justify-content:space-between;gap:8px;padding-top:8px;font:400 10.5px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cap .zone{text-align:right;overflow-wrap:anywhere}
.more{position:absolute;top:8px;right:8px;background:rgba(12,13,13,.72);color:var(--fg);font:400 10.5px/1 var(--mono);letter-spacing:.08em;padding:5px 7px;border-radius:2px}

.empty{padding:56px 0;max-width:34rem}
.empty .big{font:italic 500 clamp(1.8rem,6vw,2.6rem)/1.1 var(--display);margin:0 0 12px}
.empty p{color:var(--muted);margin:0 0 22px}
.empty .acts{margin-top:4px}

.sec{margin-top:56px;padding-top:32px;border-top:1px solid var(--line);max-width:760px}
.sec h2{font:italic 600 clamp(1.9rem,7vw,2.8rem)/1 var(--display);margin:0 0 16px}
.sec p{margin:0 0 16px;color:#c9c6bd;max-width:60ch;white-space:pre-wrap;overflow-wrap:anywhere}
.sec p.muted{color:var(--muted)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 20px;margin:0 0 20px;font-size:15px}
.facts dt{font:400 11px/1.9 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.mail{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin:16px 0 0!important;color:var(--fg)!important}
.mail span{user-select:all;overflow-wrap:anywhere}

.btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--bg);border:0;border-radius:2px;padding:13px 20px;font:500 14px/1 var(--body);letter-spacing:.02em;text-decoration:none}
.btn.ghost{background:none;color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--danger);border:1px solid var(--danger)}
.btn[disabled]{opacity:.55;cursor:default}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:0 8px 28px rgba(0,0,0,.55)}
.fab.alt{background:var(--surface);color:var(--fg);border:1px solid var(--accent)}
.acts{display:flex;flex-wrap:wrap;gap:10px}

/* visor */
.vw{position:fixed;inset:0;z-index:20;background:#0a0b0b;display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain}
.vw-bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#0a0b0b;border-bottom:1px solid var(--line);padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.vw-bar .pos{font:400 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.vw-bar .nav{display:flex;gap:6px}
.sq{background:none;border:1px solid var(--line);border-radius:2px;min-width:44px;height:40px;padding:0 12px;font:400 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase}
.vw-body{width:100%;max-width:980px;margin:0 auto;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.strip{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;display:flex;justify-content:center;background:#050606}
.slide img{display:block;width:auto;max-width:100%;max-height:72vh;height:auto}
.dots{display:flex;justify-content:center;gap:6px;padding:12px 0 0;font:400 11px/1 var(--mono);letter-spacing:.12em;color:var(--muted)}
.info{padding:22px max(16px,env(safe-area-inset-left,0px)) 0}
.info h2{font:italic 600 clamp(1.9rem,7vw,3rem)/1 var(--display);margin:0 0 18px;overflow-wrap:anywhere}
.note{color:#c9c6bd;max-width:60ch;white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 24px}

/* formularios */
.sheet-wrap{position:fixed;inset:0;z-index:30;background:rgba(5,6,6,.82);display:flex;align-items:flex-end;justify-content:center;overflow-y:auto}
@media(min-width:720px){.sheet-wrap{align-items:center}}
.sheet{width:100%;max-width:560px;max-height:100%;overflow-y:auto;background:var(--surface);border:1px solid var(--line);padding:22px max(18px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px))}
.sheet h2{font:italic 600 2rem/1 var(--display);margin:0 0 18px}
.sheet label.l{display:block;font:400 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.sheet input:not([type=checkbox]):not([type=file]),.sheet textarea{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:2px;padding:12px;font:16px/1.3 var(--body)}
.sheet textarea{resize:vertical;min-height:84px}
.sheet .chk{display:flex;align-items:center;gap:10px;margin:14px 0 0;font-size:15px}
.sheet .chk input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-bottom:10px}
.th{position:relative;aspect-ratio:1;background:var(--bg);overflow:hidden;border-radius:2px}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(12,13,13,.8);color:var(--fg);font-size:16px;line-height:1;padding:0}
.th .cv{position:absolute;left:4px;bottom:4px;background:rgba(12,13,13,.8);font:400 9px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:4px 5px;border-radius:2px}
.pick{display:inline-flex;align-items:center;gap:8px;border:1px dashed var(--accent);color:var(--accent);padding:12px 16px;border-radius:2px;cursor:pointer;font-size:14px}
.err{color:var(--danger);margin:14px 0 0;font-size:14px}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:13px;margin:8px 0 0}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="root"></div>
<div id="layer"></div>
<script>
/* ============================================================
   CONFIGURACIÓN: pega aquí los dos datos de tu proyecto Supabase.
   Están en Supabase → Project Settings → API.
   Lee LEEME.md para los pasos completos.
   ============================================================ */
var CONFIG = {
  url: 'https://etrrygletfwvklhsqcpo.supabase.co',
  anonKey: 'sb_publishable_MJQvDODVTq5ZxdLlsJpW6A_UfZdj1bE'
};

(function () {
  'use strict';
  var BUCKET = 'tattoos';
  var SESSION_KEY = 'portafolio-sesion';
  var CACHE_KEY = 'portafolio-cache';
  var ZONES = ['Brazo', 'Antebrazo', 'Mano', 'Dedos', 'Hombro', 'Pecho', 'Espalda', 'Costillas', 'Abdomen', 'Cadera', 'Muslo', 'Rodilla', 'Pierna', 'Pantorrilla', 'Tobillo', 'Pie', 'Cuello', 'Detrás de la oreja', 'Cabeza'];
  var STYLES = ['Fine line', 'Realismo', 'Blackwork', 'Tradicional', 'Neotradicional', 'Minimalista', 'Acuarela', 'Geométrico', 'Dotwork', 'Lettering', 'Ornamental', 'Japonés', 'Anime', 'Cover up'];

  var root = document.getElementById('root');
  var layer = document.getElementById('layer');
  var S = { profile: {}, items: [] };
  var session = null;
  var asVisitor = false;
  var filter = '';
  var view = null;
  var draft = null;
  var loading = true;
  var loadError = '';

  /* ---------- utilidades ---------- */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function key(z) { return String(z || '').trim().toLowerCase(); }
  function configured() { return !!(CONFIG.url && CONFIG.anonKey); }
  function editing() { return !!session && !asVisitor; }
  function src(p) {
    if (p.url) return p.url;
    return CONFIG.url.replace(/\/+$/, '') + '/storage/v1/object/public/' + BUCKET + '/' + p.path;
  }
  function fmtDate(s) {
    if (!s) return '';
    var a = String(s).split('-').map(Number);
    if (!a[0]) return '';
    try { return new Intl.DateTimeFormat('es', { day: 'numeric', month: 'short', year: 'numeric' }).format(new Date(a[0], a[1] - 1, a[2])); }
    catch (e) { return s; }
  }
  function cmp(a, b) {
    var da = a.date || '', db = b.date || '';
    if (da !== db) { if (!da) return 1; if (!db) return -1; return da < db ? 1 : -1; }
    return String(b.created || '') < String(a.created || '') ? -1 : 1;
  }
  function tally(field) {
    var m = {}, out = [];
    S.items.forEach(function (i) {
      var k = key(i[field]);
      if (!k) return;
      if (!m[k]) { m[k] = { k: k, label: String(i[field]).trim(), n: 0 }; out.push(m[k]); }
      m[k].n++;
    });
    out.sort(function (a, b) { return b.n - a.n || a.label.localeCompare(b.label, 'es'); });
    return out;
  }
  function visible() {
    return S.items.slice().sort(cmp).filter(function (i) { return !filter || key(i.style) === filter; });
  }
  function byId(id) { return S.items.filter(function (i) { return i.id === id; })[0]; }
  function hasContact() { var p = S.profile; return !!(p.ig || p.wa || p.email); }

  /* ---------- sesión y API (Supabase por HTTP, sin librerías) ---------- */
  function readSession() { try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch (e) { return null; } }
  function setSession(s) {
    session = s;
    try { if (s) localStorage.setItem(SESSION_KEY, JSON.stringify(s)); else localStorage.removeItem(SESSION_KEY); } catch (e) {}
  }
  function base() { return CONFIG.url.replace(/\/+$/, ''); }
  function toSession(j) {
    return { access: j.access_token, refresh: j.refresh_token, exp: Date.now() + (j.expires_in || 3600) * 1000, email: (j.user && j.user.email) || '' };
  }
  async function refreshSession() {
    if (!session || !session.refresh) { setSession(null); return; }
    try {
      var r = await fetch(base() + '/auth/v1/token?grant_type=refresh_token', {
        method: 'POST',
        headers: { apikey: CONFIG.anonKey, 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: session.refresh })
      });
      if (!r.ok) { setSession(null); return; }
      setSession(toSession(await r.json()));
    } catch (e) { /* sin conexión: se mantiene la sesión y se reintenta luego */ }
  }
  async function api(path, opts) {
    opts = opts || {};
    if (session && Date.now() > session.exp - 60000) await refreshSession();
    var h = Object.assign({ apikey: CONFIG.anonKey }, opts.headers || {});
    if (session) h.Authorization = 'Bearer ' + session.access;
    var r = await fetch(base() + path, Object.assign({}, opts, { headers: h }));
    if (!r.ok) {
      var m = '';
      try { var j = await r.json(); m = j.message || j.error_description || j.error || ''; } catch (e) {}
      var er = new Error(m || ('Error ' + r.status));
      er.status = r.status;
      throw er;
    }
    return r;
  }
  function jsonHeaders() { return { 'Content-Type': 'application/json', Prefer: 'return=minimal' }; }
  function errMsg(e) {
    var s = e && e.status;
    if (s === 401 || s === 403) return 'No tienes permiso o la sesión caducó. Entra de nuevo desde /#admin.';
    if (s === 413) return 'Una foto pesa demasiado. Prueba con otra más ligera.';
    if (e && e.name === 'TypeError') return 'No hay conexión con el servidor. Revisa internet e inténtalo otra vez.';
    return (e && e.message) ? e.message : 'No se pudo guardar. Inténtalo de nuevo.';
  }

  /* ---------- datos ---------- */
  function norm(t) {
    return { id: t.id, title: t.title || '', style: t.style || '', zone: t.zone || '', date: t.date || '', note: t.note || '', photos: Array.isArray(t.photos) ? t.photos : [], created: t.created_at || '' };
  }
  async function load() {
    loading = true; loadError = '';
    try {
      var res = await Promise.all([api('/rest/v1/profile?select=data&id=eq.1'), api('/rest/v1/tattoos?select=*')]);
      var pj = await res[0].json(), tj = await res[1].json();
      S.profile = (pj[0] && pj[0].data) || {};
      S.items = tj.map(norm).filter(function (i) { return i.photos.length; });
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(S)); } catch (e) {}
    } catch (e) {
      loadError = 'No se pudo cargar el portafolio.';
      try { var c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); if (c && c.items) { S = c; loadError = 'Sin conexión: se muestra la última versión guardada en este dispositivo.'; } } catch (x) {}
    }
    loading = false;
    document.title = S.profile.name ? S.profile.name + ' · Tatuajes' : 'Portafolio de tatuajes';
  }
  async function removeFiles(paths) {
    if (!paths.length) return;
    try {
      await api('/storage/v1/object/' + BUCKET, { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prefixes: paths }) });
    } catch (e) { /* si falla, queda un archivo huérfano; no afecta al portafolio */ }
  }

  /* ---------- imágenes ---------- */
  function loadImg(file) {
    return new Promise(function (res, rej) {
      var u = URL.createObjectURL(file), im = new Image();
      im.onload = function () { res(im); };
      im.onerror = function () { rej(new Error('No se pudo leer ' + (file.name || 'la foto') + '.')); };
      im.src = u;
    });
  }
  async function prep(file) {
    var bmp;
    try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
    catch (e) { bmp = await loadImg(file); }
    var w0 = bmp.width, h0 = bmp.height;
    var k = Math.min(1, 1800 / Math.max(w0, h0));
    var w = Math.round(w0 * k), h = Math.round(h0 * k);
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    var x = c.getContext('2d');
    x.fillStyle = '#000'; x.fillRect(0, 0, w, h);
    x.drawImage(bmp, 0, 0, w, h);
    var blob = await new Promise(function (r) { c.toBlob(r, 'image/jpeg', 0.86); });
    if (!blob) throw new Error('No se pudo preparar la foto.');
    return { blob: blob, w: w, h: h };
  }
  async function uploadPhoto(blob) {
    var path = 'f/' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8) + '.jpg';
    await api('/storage/v1/object/' + BUCKET + '/' + path, { method: 'POST', headers: { 'Content-Type': 'image/jpeg', 'x-upsert': 'false' }, body: blob });
    return path;
  }

  /* ---------- secciones ---------- */
  function aboutHTML() {
    var p = S.profile, st = tally('style');
    if (!p.bio && !st.length) return '';
    var h = '<section class="sec" id="sobre"><h2>Sobre mí</h2>';
    if (p.bio) h += '<p>' + esc(p.bio) + '</p>';
    var f = '';
    if (st.length) f += '<dt>Estilos</dt><dd>' + st.map(function (x) { return esc(x.label); }).join(' · ') + '</dd>';
    if (p.since) f += '<dt>Experiencia</dt><dd>Tatuando desde ' + esc(p.since) + '</dd>';
    if (p.city) f += '<dt>Ubicación</dt><dd>' + esc(p.city) + '</dd>';
    if (f) h += '<dl class="facts">' + f + '</dl>';
    return h + '</section>';
  }
  function contactHTML() {
    var p = S.profile;
    if (!hasContact()) {
      return editing()
        ? '<section class="sec" id="contacto"><h2>Contacto</h2><p class="muted">Añade tu WhatsApp, Instagram o correo para que clientes y estudios puedan escribirte.</p><button class="btn ghost" data-act="profile">Añadir contacto</button></section>'
        : '';
    }
    var intro = p.openBook && p.openStudio ? 'Escríbeme para agendar una cita o para colaborar con tu estudio.'
      : p.openBook ? 'Escríbeme para agendar tu cita y contarme tu idea.'
      : p.openStudio ? 'Si tienes un estudio y buscas tatuadora, escríbeme.'
      : 'Escríbeme por el medio que prefieras.';
    var h = '<section class="sec" id="contacto"><h2>Contacto</h2><p>' + esc(intro) + '</p><div class="acts">';
    if (p.wa) h += '<a class="btn" href="https://wa.me/' + esc(p.wa) + '" target="_blank" rel="noopener">WhatsApp</a>';
    if (p.ig) h += '<a class="btn ghost" href="https://instagram.com/' + esc(p.ig) + '" target="_blank" rel="noopener">Instagram @' + esc(p.ig) + '</a>';
    h += '</div>';
    if (p.email) h += '<p class="mail"><span id="mailtxt">' + esc(p.email) + '</span><a class="link" href="mailto:' + esc(p.email) + '">Escribir</a><button class="link" data-copy="mailtxt">Copiar correo</button></p>';
    return h + '</section>';
  }

  /* ---------- galería ---------- */
  function render() {
    if (!configured()) {
      root.innerHTML = '<div class="wrap"><header class="hd"><p class="eyebrow">Falta un paso</p><h1>Configura el portafolio</h1><p class="sub">Abre index.html con un editor de texto y pega la URL y la clave de tu proyecto Supabase en el bloque CONFIG, al principio del script. Los pasos están en LEEME.md.</p></header></div>';
      return;
    }
    var ed = editing();
    var all = S.items.slice().sort(cmp);
    var list = visible();
    var p = S.profile;
    var st = tally('style');
    var h = '<div class="wrap"><header class="hd"><p class="eyebrow">' + (p.city ? 'Portafolio · ' + esc(p.city) : 'Portafolio de tatuajes') + '</p><h1>' +
      esc(p.name || (ed ? 'Tu nombre' : 'Portafolio')) + '</h1>';
    if (p.sub) h += '<p class="sub">' + esc(p.sub) + '</p>';
    if (p.openBook || p.openStudio) {
      h += '<div class="badges">' + (p.openBook ? '<span class="badge">Agenda abierta</span>' : '') + (p.openStudio ? '<span class="badge">Disponible para estudios</span>' : '') + '</div>';
    }
    h += '<p class="meta"><span>' + all.length + (all.length === 1 ? ' trabajo' : ' trabajos') + '</span>';
    if (p.since) h += '<span>Desde ' + esc(p.since) + '</span>';
    if (p.ig) h += '<a href="https://instagram.com/' + esc(p.ig) + '" target="_blank" rel="noopener">@' + esc(p.ig) + '</a>';
    if (ed) h += '<button class="link" data-act="profile">Editar perfil</button><button class="link" data-act="preview">Ver como visitante</button><button class="link" data-act="logout">Salir</button>';
    h += '</p>';
    if (hasContact()) h += '<div class="cta"><button class="btn" data-act="contact">Contactar</button></div>';
    if (ed && !loading && (!p.name || !p.bio || !hasContact())) {
      h += '<p class="nudge">Completa tu perfil (nombre, sobre mí y contacto) para que estudios y clientes sepan quién eres y cómo escribirte. <button class="link" data-act="profile">Completar ahora</button></p>';
    }
    h += '</header>';
    if (loadError) h += '<p class="banner">' + esc(loadError) + ' <button class="link" data-act="retry">Reintentar</button></p>';
    if (loading) {
      h += '<p class="status">Cargando trabajos…</p>';
    } else {
      if (st.length > 1) {
        h += '<div class="chips" role="group" aria-label="Filtrar por estilo"><button class="chip" data-zone="" aria-pressed="' + (!filter) + '">Todos</button>';
        st.forEach(function (x) {
          h += '<button class="chip" data-zone="' + esc(x.k) + '" aria-pressed="' + (filter === x.k) + '">' + esc(x.label) + ' ' + x.n + '</button>';
        });
        h += '</div>';
      }
      if (!all.length) {
        h += ed
          ? '<div class="empty"><p class="big">Aquí vivirá todo tu trabajo.</p><p>Empieza por completar tu perfil y sube después la foto de tu primer tatuaje, con su estilo, fecha y zona del cuerpo.</p><div class="acts"><button class="btn" data-act="add">Añadir primer tatuaje</button><button class="btn ghost" data-act="profile">Completar perfil</button></div></div>'
          : '<div class="empty"><p class="big">Pronto habrá trabajos aquí.</p><p>Este portafolio todavía no tiene tatuajes publicados.</p></div>';
      } else {
        h += '<div class="grid">';
        list.forEach(function (it) {
          var ph = it.photos[0];
          var n = it.photos.length;
          h += '<button class="tile" data-open="' + esc(it.id) + '" aria-label="Abrir ' + esc(it.title || it.style || it.zone || 'tatuaje') + '">' +
            '<img loading="lazy" src="' + esc(src(ph)) + '" alt="' + esc(it.title || it.style || it.zone || 'Tatuaje') + '"' + (ph.w ? ' width="' + ph.w + '" height="' + ph.h + '"' : '') + '>' +
            (n > 1 ? '<span class="more">+' + (n - 1) + '</span>' : '') +
            '<span class="cap"><span>' + esc(it.style || it.title || '') + '</span><span class="zone">' + esc(it.zone || '') + '</span></span></button>';
        });
        h += '</div>';
      }
      h += aboutHTML() + contactHTML();
    }
    h += '</div>';
    if (ed && !loading) h += '<button class="btn fab" data-act="add" aria-label="Añadir tatuaje">+ Añadir tatuaje</button>';
    else if (session && asVisitor) h += '<button class="btn fab alt" data-act="unpreview">← Volver a editar</button>';
    root.innerHTML = h;
  }

  /* ---------- visor ---------- */
  function lock(on) { document.body.style.overflow = on ? 'hidden' : ''; }
  function closeLayer() { layer.innerHTML = ''; view = null; draft = null; lock(false); }
  function renderViewer() {
    var it = byId(view.id);
    if (!it) { closeLayer(); return; }
    var ed = editing();
    var list = visible();
    var idx = list.map(function (x) { return x.id; }).indexOf(it.id);
    var label = it.title || it.style || it.zone || 'Tatuaje';
    var h = '<div class="vw" role="dialog" aria-modal="true" aria-label="Detalle del tatuaje">' +
      '<div class="vw-bar"><button class="sq" data-act="close">Cerrar</button>' +
      '<span class="pos">' + (idx >= 0 ? (idx + 1) + ' / ' + list.length : '') + '</span>' +
      '<div class="nav"><button class="sq" data-act="prev" aria-label="Anterior">←</button><button class="sq" data-act="next" aria-label="Siguiente">→</button></div></div>' +
      '<div class="vw-body"><div class="strip">';
    it.photos.forEach(function (p) {
      h += '<div class="slide"><img src="' + esc(src(p)) + '" alt="' + esc(label) + '"' + (p.w ? ' width="' + p.w + '" height="' + p.h + '"' : '') + '></div>';
    });
    h += '</div>';
    if (it.photos.length > 1) h += '<div class="dots">Desliza · ' + it.photos.length + ' fotos</div>';
    h += '<div class="info"><h2>' + esc(it.title || it.style || it.zone || 'Sin título') + '</h2><dl class="facts">';
    if (it.style) h += '<dt>Estilo</dt><dd>' + esc(it.style) + '</dd>';
    if (it.zone) h += '<dt>Zona</dt><dd>' + esc(it.zone) + '</dd>';
    if (it.date) h += '<dt>Fecha</dt><dd>' + esc(fmtDate(it.date)) + '</dd>';
    h += '</dl>';
    if (it.note) h += '<p class="note">' + esc(it.note) + '</p>';
    h += '<div class="acts">';
    if (!ed && hasContact()) h += '<button class="btn" data-act="contact">Quiero algo así</button>';
    if (ed) {
      h += '<button class="btn ghost" data-act="edit">Editar</button>' +
        (view.confirm
          ? '<button class="btn danger" data-act="del-yes">Sí, eliminar</button><button class="btn ghost" data-act="del-no">Cancelar</button>'
          : '<button class="btn danger" data-act="del">Eliminar</button>');
    }
    h += '</div>';
    if (ed && view.err) h += '<p class="err">' + esc(view.err) + '</p>';
    h += '</div></div></div>';
    layer.innerHTML = h;
    lock(true);
  }
  function step(d) {
    var list = visible();
    var idx = list.map(function (x) { return x.id; }).indexOf(view.id);
    if (idx < 0 || list.length < 2) return;
    view = { id: list[(idx + d + list.length) % list.length].id, confirm: false };
    renderViewer();
    var v = layer.querySelector('.vw'); if (v) v.scrollTop = 0;
  }
  function toContact() {
    closeLayer();
    var el = document.getElementById('contacto');
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  /* ---------- formularios ---------- */
  function thumbsHTML() {
    return draft.photos.map(function (p, i) {
      return '<div class="th"><img src="' + esc(src(p)) + '" alt="">' + (i === 0 ? '<span class="cv">Portada</span>' : '') +
        '<button type="button" data-rm="' + i + '" aria-label="Quitar foto">×</button></div>';
    }).join('');
  }
  function showErr(m) { var e = layer.querySelector('#err'); if (!e) return; e.textContent = m; e.hidden = !m; }
  function options(baseList, field) {
    var zs = baseList.slice();
    tally(field).forEach(function (x) { if (zs.map(key).indexOf(x.k) < 0) zs.push(x.label); });
    return zs.map(function (x) { return '<option value="' + esc(x) + '">'; }).join('');
  }
  function showLogin() {
    layer.innerHTML = '<div class="sheet-wrap"><form class="sheet" id="lf" role="dialog" aria-modal="true" aria-label="Entrar"><h2>Entrar</h2>' +
      '<p class="hint">Acceso solo para la dueña del portafolio.</p>' +
      '<label class="l" for="le">Correo</label><input type="email" id="le" autocomplete="username" required>' +
      '<label class="l" for="lp">Contraseña</label><input type="password" id="lp" autocomplete="current-password" required>' +
      '<p class="err" id="err" hidden></p>' +
      '<div class="row"><button type="button" class="btn ghost" data-act="cancel">Cancelar</button><button type="submit" class="btn" id="save">Entrar</button></div></form></div>';
    lock(true);
    var e = layer.querySelector('#le'); if (e) e.focus();
  }
  function showForm(it) {
    draft = { id: it ? it.id : null, orig: it ? it.photos.map(function (p) { return p.path; }) : [], photos: it ? it.photos.map(function (p) { return { path: p.path, w: p.w, h: p.h }; }) : [] };
    var h = '<div class="sheet-wrap"><form class="sheet" id="f" role="dialog" aria-modal="true" aria-label="' + (it ? 'Editar tatuaje' : 'Nuevo tatuaje') + '">' +
      '<h2>' + (it ? 'Editar tatuaje' : 'Nuevo tatuaje') + '</h2>' +
      '<div class="thumbs" id="th">' + thumbsHTML() + '</div>' +
      '<label class="pick" for="files">+ Añadir fotos</label><input class="vh" id="files" type="file" accept="image/*" multiple>' +
      '<p class="hint">La primera foto es la portada. Puedes subir varias de la misma pieza (recién hecha, cicatrizada).</p>' +
      '<label class="l" for="t">Título (opcional)</label><input type="text" id="t" maxlength="80" autocomplete="off">' +
      '<label class="l" for="s">Estilo</label><input type="text" id="s" list="sl" maxlength="40" autocomplete="off"><datalist id="sl">' + options(STYLES, 'style') + '</datalist>' +
      '<label class="l" for="d">Fecha</label><input type="date" id="d">' +
      '<label class="l" for="z">Zona del cuerpo</label><input type="text" id="z" list="zl" maxlength="40" autocomplete="off"><datalist id="zl">' + options(ZONES, 'zone') + '</datalist>' +
      '<label class="l" for="n">Nota (opcional)</label><textarea id="n" maxlength="600"></textarea>' +
      '<p class="err" id="err" hidden></p>' +
      '<div class="row"><button type="button" class="btn ghost" data-act="cancel">Cancelar</button><button type="submit" class="btn" id="save">Guardar</button></div></form></div>';
    layer.innerHTML = h;
    lock(true);
    if (it) {
      layer.querySelector('#t').value = it.title || '';
      layer.querySelector('#s').value = it.style || '';
      layer.querySelector('#d').value = it.date || '';
      layer.querySelector('#z').value = it.zone || '';
      layer.querySelector('#n').value = it.note || '';
    }
  }
  function showProfile() {
    var p = S.profile;
    layer.innerHTML = '<div class="sheet-wrap"><form class="sheet" id="pf" role="dialog" aria-modal="true" aria-label="Editar perfil"><h2>Tu perfil</h2>' +
      '<label class="l" for="pn">Nombre</label><input type="text" id="pn" maxlength="60" autocomplete="off">' +
      '<label class="l" for="ps">Descripción corta</label><input type="text" id="ps" maxlength="120" autocomplete="off" placeholder="Tatuadora · fine line y realismo">' +
      '<label class="l" for="pc">Ciudad</label><input type="text" id="pc" maxlength="60" autocomplete="off">' +
      '<label class="l" for="py">Tatuando desde (año)</label><input type="text" id="py" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="2021">' +
      '<label class="l" for="pb">Sobre mí</label><textarea id="pb" maxlength="900" placeholder="Cuenta tu estilo, cómo trabajas y qué te gusta tatuar."></textarea>' +
      '<label class="chk"><input type="checkbox" id="pob"> Agenda abierta para clientes</label>' +
      '<label class="chk"><input type="checkbox" id="pos"> Disponible para trabajar en un estudio</label>' +
      '<label class="l" for="pw">WhatsApp</label><input type="text" id="pw" inputmode="tel" maxlength="24" autocomplete="off" placeholder="Con código de país, ej. 584121234567">' +
      '<label class="l" for="pi">Instagram</label><input type="text" id="pi" maxlength="40" autocomplete="off" placeholder="usuario">' +
      '<label class="l" for="pe">Correo de contacto</label><input type="text" id="pe" inputmode="email" maxlength="80" autocomplete="off">' +
      '<p class="err" id="err" hidden></p>' +
      '<div class="row"><button type="button" class="btn ghost" data-act="cancel">Cancelar</button><button type="submit" class="btn" id="save">Guardar</button></div></form></div>';
    layer.querySelector('#pn').value = p.name || '';
    layer.querySelector('#ps').value = p.sub || '';
    layer.querySelector('#pc').value = p.city || '';
    layer.querySelector('#py').value = p.since || '';
    layer.querySelector('#pb').value = p.bio || '';
    layer.querySelector('#pob').checked = !!p.openBook;
    layer.querySelector('#pos').checked = !!p.openStudio;
    layer.querySelector('#pw').value = p.wa || '';
    layer.querySelector('#pi').value = p.ig || '';
    layer.querySelector('#pe').value = p.email || '';
    lock(true);
  }
  function copyText(id, btn) {
    var el = document.getElementById(id);
    if (!el) return;
    function select() {
      try { var r = document.createRange(); r.selectNodeContents(el); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); } catch (x) {}
      btn.textContent = 'Selecciona y copia';
    }
    function done() { btn.textContent = 'Copiado'; setTimeout(function () { btn.textContent = 'Copiar correo'; }, 2000); }
    try { navigator.clipboard.writeText(el.textContent).then(done, select); } catch (e) { select(); }
  }

  /* ---------- eventos ---------- */
  document.addEventListener('click', async function (e) {
    var t = e.target.closest('[data-act],[data-open],[data-zone],[data-rm],[data-copy]');
    if (!t) return;
    if (t.hasAttribute('data-copy')) { copyText(t.getAttribute('data-copy'), t); return; }
    if (t.hasAttribute('data-zone')) { filter = t.getAttribute('data-zone'); render(); return; }
    if (t.hasAttribute('data-open')) { view = { id: t.getAttribute('data-open'), confirm: false }; renderViewer(); return; }
    if (t.hasAttribute('data-rm')) {
      var i = Number(t.getAttribute('data-rm'));
      var gone = draft.photos.splice(i, 1)[0];
      if (gone && gone.url) { try { URL.revokeObjectURL(gone.url); } catch (x) {} }
      layer.querySelector('#th').innerHTML = thumbsHTML();
      return;
    }
    var a = t.getAttribute('data-act');
    if (a === 'close') closeLayer();
    else if (a === 'prev') step(-1);
    else if (a === 'next') step(1);
    else if (a === 'contact') toContact();
    else if (a === 'retry') { await load(); render(); }
    else if (a === 'preview') { asVisitor = true; render(); window.scrollTo(0, 0); }
    else if (a === 'unpreview') { asVisitor = false; render(); }
    else if (a === 'logout') { setSession(null); asVisitor = false; closeLayer(); render(); }
    else if (a === 'add' && session) showForm(null);
    else if (a === 'edit' && session) showForm(byId(view.id));
    else if (a === 'profile' && session) showProfile();
    else if (a === 'cancel') { if (view) { draft = null; renderViewer(); } else closeLayer(); }
    else if (a === 'del') { view.confirm = true; view.err = ''; renderViewer(); }
    else if (a === 'del-no') { view.confirm = false; renderViewer(); }
    else if (a === 'del-yes') {
      var it = byId(view.id);
      try {
        await api('/rest/v1/tattoos?id=eq.' + encodeURIComponent(view.id), { method: 'DELETE', headers: { Prefer: 'return=minimal' } });
        await removeFiles(it ? it.photos.map(function (p) { return p.path; }) : []);
        closeLayer(); await load(); render();
      } catch (er) { view.confirm = false; view.err = errMsg(er); renderViewer(); }
    }
  });
  document.addEventListener('change', function (e) {
    if (!e.target || e.target.id !== 'files' || !draft) return;
    Array.prototype.forEach.call(e.target.files, function (f) {
      draft.photos.push({ file: f, url: URL.createObjectURL(f) });
    });
    e.target.value = '';
    layer.querySelector('#th').innerHTML = thumbsHTML();
    showErr('');
  });
  document.addEventListener('keydown', function (e) {
    if (!layer.firstChild) return;
    if (e.key === 'Escape') { if (layer.querySelector('.vw')) closeLayer(); else if (view) { draft = null; renderViewer(); } else closeLayer(); }
    else if (view && layer.querySelector('.vw')) {
      if (e.key === 'ArrowLeft') step(-1);
      if (e.key === 'ArrowRight') step(1);
    }
  });
  document.addEventListener('submit', async function (e) {
    e.preventDefault();
    var form = e.target, btn = layer.querySelector('#save');
    var v = function (id) { return layer.querySelector('#' + id).value.trim(); };

    if (form.id === 'lf') {
      btn.disabled = true; btn.textContent = 'Entrando…'; showErr('');
      try {
        var r = await fetch(base() + '/auth/v1/token?grant_type=password', {
          method: 'POST',
          headers: { apikey: CONFIG.anonKey, 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: v('le'), password: layer.querySelector('#lp').value })
        });
        if (!r.ok) {
          showErr(r.status === 400 ? 'Correo o contraseña incorrectos.' : 'No se pudo entrar (error ' + r.status + ').');
          btn.disabled = false; btn.textContent = 'Entrar';
          return;
        }
        setSession(toSession(await r.json()));
        try { history.replaceState(null, '', location.pathname + location.search); } catch (x) {}
        closeLayer(); render();
      } catch (er) { showErr(errMsg(er)); btn.disabled = false; btn.textContent = 'Entrar'; }
      return;
    }
    if (!session) return;

    if (form.id === 'pf') {
      var em = v('pe');
      if (em && !/^\S+@\S+\.\S+$/.test(em)) { showErr('El correo no parece válido.'); return; }
      var data = {
        name: v('pn'), sub: v('ps'), city: v('pc'),
        since: v('py').replace(/\D/g, '').slice(0, 4), bio: v('pb'),
        ig: v('pi').replace(/^.*instagram\.com\//i, '').replace(/^@/, '').replace(/[^A-Za-z0-9._]/g, ''),
        wa: v('pw').replace(/\D/g, ''), email: em,
        openBook: layer.querySelector('#pob').checked, openStudio: layer.querySelector('#pos').checked
      };
      btn.disabled = true; btn.textContent = 'Guardando…';
      try {
        await api('/rest/v1/profile?id=eq.1', { method: 'PATCH', headers: jsonHeaders(), body: JSON.stringify({ data: data }) });
        S.profile = data; closeLayer(); await load(); render();
      } catch (er) { showErr(errMsg(er)); btn.disabled = false; btn.textContent = 'Guardar'; }
      return;
    }

    if (form.id !== 'f') return;
    if (!draft.photos.length) { showErr('Añade al menos una foto.'); return; }
    btn.disabled = true; showErr('');
    var uploaded = [];
    try {
      var out = [], n = 0, total = draft.photos.filter(function (p) { return p.file; }).length;
      for (var i = 0; i < draft.photos.length; i++) {
        var p = draft.photos[i];
        if (p.file) {
          n++; btn.textContent = 'Subiendo foto ' + n + ' de ' + total + '…';
          var pr = await prep(p.file);
          var path = await uploadPhoto(pr.blob);
          uploaded.push(path);
          out.push({ path: path, w: pr.w, h: pr.h });
        } else out.push({ path: p.path, w: p.w, h: p.h });
      }
      var rec = {
        title: v('t'), style: v('s'), zone: v('z'), note: v('n'),
        date: layer.querySelector('#d').value || null,
        photos: out
      };
      btn.textContent = 'Guardando…';
      if (draft.id) {
        await api('/rest/v1/tattoos?id=eq.' + encodeURIComponent(draft.id), { method: 'PATCH', headers: jsonHeaders(), body: JSON.stringify(rec) });
        var keep = out.map(function (x) { return x.path; });
        await removeFiles(draft.orig.filter(function (x) { return keep.indexOf(x) < 0; }));
      } else {
        await api('/rest/v1/tattoos', { method: 'POST', headers: jsonHeaders(), body: JSON.stringify(rec) });
      }
      closeLayer(); await load(); render();
    } catch (er) {
      if (uploaded.length) removeFiles(uploaded);
      showErr(errMsg(er)); btn.disabled = false; btn.textContent = 'Guardar';
    }
  });
  window.addEventListener('hashchange', function () {
    if (location.hash === '#admin' && configured() && !session) showLogin();
  });

  /* ---------- arranque ---------- */
  session = readSession();
  render();
  if (configured()) {
    load().then(function () {
      render();
      if (location.hash === '#admin' && !session) showLogin();
    });
  }
})();
</script>
</body>
</html>
